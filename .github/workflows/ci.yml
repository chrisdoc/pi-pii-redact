name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Typecheck & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The redaction model is downloaded from Hugging Face on first use; cache it between runs.
      - name: Cache redaction model
        uses: actions/cache@v4
        with:
          path: ~/.cache/desert-ant-models
          key: desert-ant-models-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: desert-ant-models-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
