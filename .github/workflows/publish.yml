name: Publish

# Releases are driven by Changesets (https://changesets.dev):
# - Pushes to main with pending changesets open or update a "Version Packages" PR.
# - Merging that PR publishes @chrisdoc/pi-pii-redact to npm and creates a GitHub release.
#
# npm authentication uses trusted publishing (OIDC), so no NPM_TOKEN is needed. The
# trusted publisher on npmjs.com must point at repository chrisdoc/pi-pii-redact and
# workflow file publish.yml. Only the publish job gets id-token: write.

on:
  push:
    branches: [main]

permissions: {} # each job sets its own permissions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false # avoid cache poisoning in release jobs

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Version
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to commit version changes (changesets/action/version)
      pull-requests: write # to create the Version Packages PR (changesets/action/version)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Create or update Version Packages PR
        uses: changesets/action/version@v2

  pack:
    name: Pack
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # No build step: Pi loads the TypeScript sources directly.
      - name: Pack package
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to push tags and create GitHub releases (changesets/action/publish)
      id-token: write # for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # Trusted publishing requires npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Publish to npm and create GitHub release
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
